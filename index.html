<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d9602b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Obědy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Naše obědy</title>
<script>try{var __t=localStorage.getItem("theme");if(__t)document.documentElement.setAttribute("data-theme",__t)}catch(e){}</script>
<style>
:root{--bg:#f7f4ef;--card:#fff;--soft:#f3eee6;--tx:#221f1b;--mut:#766e64;--ac:#e2562a;--ac2:#ff8a4c;--acx:#c8431b;--onac:#fff;--bd:#e8e1d6;--st:#f0a50c;
--sh:0 1px 2px rgba(50,35,20,.05),0 10px 30px -10px rgba(50,35,20,.14);--sh2:0 2px 4px rgba(50,35,20,.06),0 22px 44px -12px rgba(50,35,20,.26);
--c-s:#2563eb;--c-h:#16a34a;--c-k:#9333ea;--c-z:#0d9488;--r:22px;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12100e;--card:#1c1916;--soft:#25211c;--tx:#f5f0e9;--mut:#a79e93;--ac:#ff7a45;--ac2:#ffb067;--acx:#ff9460;--onac:#1a0d05;--bd:#302b25;--st:#ffc23d;--sh:0 1px 2px rgba(0,0,0,.5),0 14px 34px -10px rgba(0,0,0,.65);--sh2:0 2px 4px rgba(0,0,0,.5),0 24px 48px -12px rgba(0,0,0,.8);--c-s:#7fb0ff;--c-h:#58e08a;--c-k:#cd97ff;--c-z:#3ddbc8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12100e;--card:#1c1916;--soft:#25211c;--tx:#f5f0e9;--mut:#a79e93;--ac:#ff7a45;--ac2:#ffb067;--acx:#ff9460;--onac:#1a0d05;--bd:#302b25;--st:#ffc23d;--sh:0 1px 2px rgba(0,0,0,.5),0 14px 34px -10px rgba(0,0,0,.65);--sh2:0 2px 4px rgba(0,0,0,.5),0 24px 48px -12px rgba(0,0,0,.8);--c-s:#7fb0ff;--c-h:#58e08a;--c-k:#cd97ff;--c-z:#3ddbc8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;
background:radial-gradient(900px 420px at 90% -80px,color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%),radial-gradient(700px 380px at -10% 0,color-mix(in srgb,var(--c-z) 10%,transparent),transparent 70%),var(--bg);background-repeat:no-repeat;transition:background-color .2s,color .2s}
body.noscroll{overflow:hidden}
main{max-width:1080px;margin:0 auto;padding:20px 16px 120px}
button,input,select{font:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:0 0 auto;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:1.5rem;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 20px -6px color-mix(in srgb,var(--ac) 60%,transparent)}
h1{margin:0;font-size:clamp(1.35rem,4vw,1.8rem);letter-spacing:-.03em;line-height:1.15;font-weight:750}
.sub{margin:2px 0 0;color:var(--mut);font-size:.9rem}
.ico{flex:0 0 auto;display:grid;place-items:center;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;width:44px;height:44px;padding:0;font-size:1.15rem;box-shadow:var(--sh);cursor:pointer;position:relative}
.ico.sm{width:42px;height:42px}
.ico:hover{background:var(--soft)}
.ico.act::after{content:'';position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--ac);border:2px solid var(--card)}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -16px 14px;padding:10px 16px 6px;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px)}
.searchrow{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.searchrow select{width:auto;max-width:150px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:2px 16px 6px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem;box-shadow:none}
.chips button:hover{background:var(--soft)}
.chips button .cn{color:var(--mut);font-weight:600}
.chips button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chips button.on .cn{color:inherit;opacity:.7}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,var(--ac))}
.bar2{display:grid;grid-template-columns:1fr 120px 120px;gap:8px;margin-top:8px}
.bar2[hidden]{display:none}
input[type=text],input[type=password],input[type=date],input[type=search],input[type=number],select{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);box-shadow:var(--sh)}
input:focus-visible,select:focus-visible{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent)}
button:focus-visible,summary:focus-visible,.addph:focus-within{outline:2px solid var(--ac);outline-offset:2px}
label{font-size:.8rem;color:var(--mut);display:block;margin-bottom:5px;font-weight:600}
button{background:var(--ac);color:var(--onac);border:0;border-radius:14px;padding:11px 18px;font-weight:650;cursor:pointer;transition:transform .08s,background .15s,box-shadow .15s;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--ac) 70%,transparent)}
button:hover{background:var(--acx)}
button:active{transform:scale(.97)}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
button.sec:hover{background:var(--soft)}
button:disabled{opacity:.45;cursor:default;box-shadow:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.box{background:var(--card);border:1px solid color-mix(in srgb,var(--bd) 70%,transparent);border-radius:var(--r);padding:4px 18px;margin-bottom:16px;box-shadow:var(--sh)}
.box>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:14px 0;font-weight:700}
.box>summary::-webkit-details-marker{display:none}
.box>summary::after{content:'›';font-size:1.5rem;line-height:1;color:var(--mut);transition:transform .2s}
.box[open]>summary::after{transform:rotate(90deg)}
.box[open]{padding-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:14px}
.row .full{grid-column:1/-1}
.drop{display:block;border:2px dashed var(--bd);border-radius:18px;padding:26px 16px;text-align:center;cursor:pointer;color:var(--mut);margin-top:6px;background:var(--soft);font-weight:600}
.drop:hover{border-color:var(--ac);color:var(--tx)}
.drop input,.addph input{display:none}
#preview{max-height:150px;max-width:100%;border-radius:14px;display:block;margin:12px auto 0}
.mrow{display:grid;grid-template-columns:auto 1fr 80px 118px;gap:8px;align-items:center;margin-top:8px}
.mrow input,.mrow select{padding:8px 10px;box-shadow:none}
.mrow small{grid-column:2/-1;color:var(--mut);margin-top:-4px}
.mrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac);padding:0}
.meta{color:var(--mut);font-size:.85rem}
/* karty */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;align-items:start}
.item{--c:var(--ac);background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);border:1px solid color-mix(in srgb,var(--bd) 60%,transparent);transition:transform .2s,box-shadow .2s}
.item:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.s-s{--c:var(--c-s)}.s-h{--c:var(--c-h)}.s-k{--c:var(--c-k)}.s-z{--c:var(--c-z)}
.cph{position:relative;aspect-ratio:4/3;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 34%,var(--card)),color-mix(in srgb,var(--c) 8%,var(--card)))}
.cph .emo{font-size:3.4rem;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.cph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;transition:transform .4s}
.item:hover .cph img{transform:scale(1.04)}
.cph.has::after{content:'';position:absolute;inset:auto 0 0 0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.38));pointer-events:none}
.pill{position:absolute;z-index:1;pointer-events:none;display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:5px 11px;border-radius:999px;color:var(--tx);background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid color-mix(in srgb,var(--bd) 60%,transparent);font-variant-numeric:tabular-nums}
.pill.tl{top:10px;left:10px}.pill.tr{top:10px;right:10px}.pill.br{bottom:10px;right:10px}
.pill .dot{width:8px;height:8px}
.cb{padding:14px 16px 16px}
.cb h3{margin:0 0 3px;font-size:1.04rem;line-height:1.3;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.cb .avg{margin:6px 0 0;font-size:.95rem}
.star{color:var(--st);letter-spacing:1px}
.cb details{margin-top:12px}
.cb details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:14px;background:var(--soft);font-weight:650;font-size:.88rem}
.cb details>summary::-webkit-details-marker{display:none}
.cb details>summary::after{content:'›';font-size:1.3rem;line-height:1;color:var(--mut);transition:transform .2s}
.cb details[open]>summary::after{transform:rotate(90deg)}
.cb details>summary:hover{background:color-mix(in srgb,var(--soft) 70%,var(--bd))}
.rt{font-size:.9rem;margin:10px 0 0;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.rt .x{background:none;color:var(--mut);padding:0 4px;font-weight:400;margin-left:auto;box-shadow:none;border-radius:8px}
.rt .x:hover{background:none;color:var(--tx)}
.pick{display:flex;gap:2px;margin:8px 0}
.pick button{background:none;color:var(--bd);font-size:1.8rem;padding:0 3px;line-height:1;box-shadow:none;transition:transform .12s,color .12s}
.pick button:hover{background:none;color:var(--st);transform:scale(1.15)}
.pick button.on{color:var(--st)}
.fm{margin-top:12px}
.fm input[type=text]{margin-bottom:8px;box-shadow:none;padding:9px 12px}
.addph{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border:1px dashed var(--bd);border-radius:14px;padding:9px 14px;cursor:pointer;font-size:.88rem;color:var(--mut);font-weight:600;margin-bottom:0}
.addph:hover{border-color:var(--ac);color:var(--tx)}
.del{background:none;color:var(--mut);padding:0;font-weight:500;font-size:.78rem;margin-top:12px;text-decoration:underline;display:block;box-shadow:none}
.del:hover{background:none;color:var(--tx)}
.sk{height:310px;border-radius:var(--r);background:linear-gradient(100deg,var(--soft) 30%,color-mix(in srgb,var(--soft) 55%,var(--card)) 50%,var(--soft) 70%);background-size:220% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-220% 0}}
.empty{color:var(--mut);text-align:center;padding:48px 0;display:grid;gap:12px;justify-items:center}
.empty[hidden]{display:none}
.empty .big{font-size:3.2rem}
/* přehled */
.h2{font-size:.76rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 6px;font-weight:700}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0}
.stat{background:var(--soft);border-radius:16px;padding:12px 8px;text-align:center;font-size:.8rem;color:var(--mut);font-weight:600}
.stat b{display:block;font-size:1.7rem;color:var(--tx);letter-spacing:-.02em}
.rank{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--bd);font-size:.92rem}
.rank:first-of-type{border-top:0}
.rank .n{width:1.8em;text-align:center;color:var(--mut);font-weight:700;font-size:1.05rem}
.rank .t{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.bar-s{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:.9rem}
.bar-s .nm{width:84px;font-weight:700;color:var(--c)}
.bar-s .tr{flex:1;height:12px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar-s .fl{height:100%;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 70%,transparent),var(--c))}
.foot{margin-top:28px;color:var(--mut)}
.foot .box{box-shadow:none;background:transparent;border-style:dashed;padding:14px 18px}
#fstat{font-size:.85rem;color:var(--mut)}
/* přidávací panel */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:25;width:62px;height:62px;border-radius:22px;padding:0;font-size:2rem;line-height:1;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 14px 30px -8px color-mix(in srgb,var(--ac) 70%,transparent)}
.fab:hover{background:linear-gradient(135deg,var(--acx),var(--ac))}
body.sheet-open .fab{display:none}
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.shbg{position:absolute;inset:0;background:rgba(10,8,6,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .2s}
.shcard{position:relative;width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--sh2);animation:up .25s cubic-bezier(.2,.8,.2,1)}
.shhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.shhead h2{margin:0;font-size:1.25rem;letter-spacing:-.02em}
.tabs{display:flex;gap:4px;background:var(--soft);border-radius:16px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;background:transparent;color:var(--mut);box-shadow:none;border-radius:12px;padding:10px 8px}
.tabs button:hover{background:transparent;color:var(--tx)}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media(min-width:700px){.sheet{align-items:center}.shcard{border-radius:28px}}
/* hlášky */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,calc(100vw - 24px));pointer-events:none}
body.sheet-open #toasts{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#msg,#undo{pointer-events:auto;background:var(--tx);color:var(--bg);border-radius:16px;padding:11px 16px;font-size:.9rem;font-weight:600;box-shadow:var(--sh2);max-width:100%;animation:up .2s}
#msg:empty{display:none}
#undo{display:flex;align-items:center;gap:12px}
#undo[hidden]{display:none}
#undo button{background:transparent;color:var(--ac2);border:0;padding:4px 8px;box-shadow:none;font-weight:750}
#undo button:hover{background:color-mix(in srgb,var(--bg) 15%,transparent)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px;cursor:zoom-out}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:100%;border-radius:14px;object-fit:contain}
@media(max-width:700px){.row{grid-template-columns:1fr 1fr}.list{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.mrow{grid-template-columns:auto 1fr 76px}.mrow select{grid-column:2/-1}.bar2{grid-template-columns:1fr 1fr}.bar2 select{grid-column:1/-1}}
@media(max-width:480px){.list{grid-template-columns:1fr}.cph{aspect-ratio:16/10}.sub{display:none}.searchrow select{max-width:142px;padding-inline:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="lb" hidden><img alt=""></div>
<main>
<header class="top">
  <div class="brand"><div class="logo">🍽️</div><div><h1>Naše obědy</h1><p class="sub">Vyhledej jídlo, přidej fotku a hodnocení.</p></div></div>
  <button id="theme" class="ico" type="button" aria-label="Přepnout světlý a tmavý režim" title="Světlý / tmavý režim">🌙</button>
</header>

<section class="tools">
  <div class="searchrow">
    <input type="search" id="q" placeholder="🔎 Hledat jídlo…" aria-label="Hledat jídlo">
    <select id="sort" aria-label="Řazení"><option value="new">Nejnovější</option><option value="best">Nejlépe hodnocené</option><option value="az">Podle abecedy</option></select>
    <button id="ftog" class="ico sm" type="button" aria-label="Filtry" title="Filtry">⚙️</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="bar2" id="bar2" hidden>
    <select id="ff" aria-label="Filtr"><option value="">Všechna jídla</option><option value="unrated">Bez hodnocení</option><option value="rated">S hodnocením</option><option value="photo">S fotkou</option><option value="nophoto">Bez fotky</option></select>
    <input type="number" id="pmin" placeholder="Cena od" inputmode="numeric" min="0">
    <input type="number" id="pmax" placeholder="Cena do" inputmode="numeric" min="0">
  </div>
</section>

<details class="box" id="stats">
  <summary>📊 Přehled a žebříček</summary>
  <div id="statsbody"></div>
</details>

<section>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden><div class="big">🍽️</div><div id="emptytx">Zatím tu nejsou žádné obědy.</div><button id="emptyadd" type="button">Přidat první jídlo</button></div>
</section>
<footer class="foot">
  <div class="box">
    <div id="fstat"></div>
    <div class="btns">
      <button id="fexp" class="sec" type="button">⬇ Stáhnout zálohu</button>
      <label class="addph" id="fimpl" style="margin-top:0">⬆ Načíst zálohu<input type="file" id="fimp" accept=".json,application/json"></label>
    </div>
  </div>
</footer>
</main>

<button id="fab" class="fab" type="button" aria-label="Přidat jídlo" title="Přidat">＋</button>

<div id="sheet" class="sheet" hidden>
  <div class="shbg" id="shbg"></div>
  <div class="shcard" role="dialog" aria-modal="true" aria-label="Přidat jídla">
    <div class="shhead"><h2>Přidat</h2><button id="sheetx" class="ico sm" type="button" aria-label="Zavřít">✕</button></div>
    <div class="tabs"><button id="tabmenu" class="on" type="button">📋 Jídelníček</button><button id="tabman" type="button">✍️ Ručně</button></div>
    <div id="optmenu">
      <label class="drop"><input type="file" id="file" accept="image/*">📷 Vyber screenshot nebo fotku jídelníčku</label>
      <img id="preview" alt="" hidden>
      <div class="row"><div><label for="mdate">Datum jídelníčku</label><input type="date" id="mdate"></div></div>
      <div class="btns"><button id="ocr" class="sec" type="button" disabled>🔍 Přečíst text z obrázku</button></div>
      <div id="menu" hidden></div>
    </div>
    <div id="optman" hidden>
      <div class="row">
        <div class="full"><label for="name">Název jídla</label><input type="text" id="name"></div>
        <div><label for="date">Datum</label><input type="date" id="date"></div>
        <div><label for="price">Cena</label><input type="text" id="price" placeholder="120 Kč"></div>
        <div><label for="sup">Dodavatel</label><select id="sup"><option value="">—</option><option>Soused</option><option>Hlaváček</option><option>Karl</option><option>Zelená</option></select></div>
      </div>
      <label class="addph" id="mph">📷 Přidat fotku jídla<input type="file" id="mphoto" accept="image/*"></label> <span class="meta" id="mphname"></span>
      <div class="btns"><button id="save" type="button">Přidat jídlo</button></div>
    </div>
  </div>
</div>

<div id="toasts"><div id="msg"></div><div id="undo" hidden><span id="undotx"></span><button id="undobtn" type="button">Vrátit zpět</button></div></div>
<script>
(function(){
  var PROXY_URL='https://obedy.privateraids.workers.dev/';   // adresa Cloudflare Workeru (prázdné = jen lokální režim)
  var OCR_DIR='ocr';                                          // složka s rozpoznáváním textu (načítá se až při použití)
  var $=function(i){return document.getElementById(i)};
  var store=function(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null};
  var msgT=null;
  function msg(t,keep){var m=$('msg');m.textContent=t||'';clearTimeout(msgT);if(t&&!keep)msgT=setTimeout(function(){if(m.textContent===t)m.textContent=''},9000)}
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
  function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
  function slug(s){return norm(s).replace(/ /g,'-').slice(0,40)||'anon'}
  function stars(a){var n=Math.round(a),s='';for(var i=1;i<=5;i++)s+=i<=n?'★':'☆';return '<span class="star">'+s+'</span>'}
  function er(e){return (e&&(e.message||e.code))||String(e)}
  function newId(p){return (p||'l')+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function strip(o){var c=Object.assign({},o);delete c.id;return c}

  /* ---------- vzhled ---------- */
  function sysDark(){return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)}
  function applyTheme(t){
    if(t)document.documentElement.setAttribute('data-theme',t);
    var dark=t?t==='dark':sysDark();
    $('theme').textContent=dark?'☀️':'🌙';
    var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',dark?'#151311':'#f5f1ea');
  }
  applyTheme(store('theme'));
  $('theme').onclick=function(){
    var cur=document.documentElement.getAttribute('data-theme'),dark=cur?cur==='dark':sysDark(),n=dark?'light':'dark';
    store('theme',n);applyTheme(n);
  };
  $('date').value=$('mdate').value=new Date().toISOString().slice(0,10);
  function setTab(t){
    $('optmenu').hidden=t!=='menu';$('optman').hidden=t!=='man';
    $('tabmenu').className=t==='menu'?'on':'';$('tabman').className=t==='man'?'on':'';
  }
  function openAdd(t){$('sheet').hidden=false;document.body.classList.add('noscroll','sheet-open');setTab(t||'menu')}
  function closeAdd(){$('sheet').hidden=true;document.body.classList.remove('noscroll','sheet-open')}
  $('fab').onclick=function(){openAdd('menu')};
  $('emptyadd').onclick=function(){openAdd('man')};
  $('sheetx').onclick=closeAdd;$('shbg').onclick=closeAdd;
  $('tabmenu').onclick=function(){setTab('menu')};$('tabman').onclick=function(){setTab('man')};
  $('ftog').onclick=function(){$('bar2').hidden=!$('bar2').hidden};
  $('mphoto').onchange=function(e){var f=e.target.files[0];$('mphname').textContent=f?f.name:''};
  $('lb').onclick=function(){$('lb').hidden=true};
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('lb').hidden)$('lb').hidden=true;else if(!$('sheet').hidden)closeAdd()}});

  /* ---------- dodavatelé ---------- */
  var SUP={SOU:'Soused',HLA:'Hlaváček',KAR:'Karl',ZEL:'Zelená'};
  var SK={'Soused':'s','Hlaváček':'h','Karl':'k','Zelená':'z'};
  var SUPN=['Soused','Hlaváček','Karl','Zelená'];
  function supOf(code){
    var c=String(code||''),m=c.match(/\b(SOU|HLA|KAR|ZEL)\b/);
    if(m)return SUP[m[1]];
    if(/S[O0]U/i.test(c))return 'Soused';
    if(/H[LI][AÁ]/i.test(c))return 'Hlaváček';
    if(/\bK[AÁ][RN]\b/i.test(c))return 'Karl';
    if(/\bZ[E3]?L\b/i.test(c))return 'Zelená';
    return '';
  }

  /* ---------- data a synchronizace ---------- */
  var data={lunches:{},ratings:{},photos:{}}, sha=null, pend=0;
  var lunches=[], ratings=[], photos=[], drafts={}, openIds={}, supF='', photoCache={}, pending=false, loaded=false;
  function norm3(d){['lunches','ratings','photos'].forEach(function(n){d[n]=d[n]||{}});return d}
  function arr(o){return Object.keys(o||{}).map(function(id){return Object.assign({id:id},o[id])})}
  function fire(){lunches=arr(data.lunches);ratings=arr(data.ratings);photos=arr(data.photos);render()}
  function localLoad(){try{return norm3(JSON.parse(localStorage.getItem('obedyData')||'{}'))}catch(e){return norm3({})}}
  function localSave(){try{localStorage.setItem('obedyData',JSON.stringify(data))}catch(e){}}

  async function pxCall(method,body,path){
    var pw=store('obedyPw')||'';
    var r=await fetch(PROXY_URL+(path||''),{method:method,headers:{'Content-Type':'application/json','X-Obedy-Password':pw},body:body?JSON.stringify(body):undefined,cache:'no-store'});
    if(r.status===401){
      var p=prompt('Heslo k obědům:');
      if(!p)throw new Error('Chybí heslo.');
      store('obedyPw',p);
      return pxCall(method,body,path);
    }
    return r;
  }
  async function srvRead(since){
    var r=await pxCall('GET');
    if(!r.ok)throw new Error('Server: chyba '+r.status);
    var j=await r.json();
    if(since&&j.sha===since)return null;
    var d;try{d=norm3(j.text&&j.text.trim()?JSON.parse(j.text):{})}catch(e){throw new Error('Datový soubor není platný JSON.')}
    return {d:d,sha:j.sha};
  }
  async function srvWrite(d,s){
    var r=await pxCall('PUT',{sha:s,text:JSON.stringify(d)});
    if(r.status===409)return {conflict:true};
    if(!r.ok)throw new Error('Server: chyba '+r.status);
    return {sha:(await r.json()).sha};
  }
  /* změna se ihned projeví na obrazovce a na pozadí se uloží; při chybě se vrátí zpět */
  async function mutate(fn){
    if(!PROXY_URL){fn(data);localSave();fire();return}
    var clone=JSON.parse(JSON.stringify(data));fn(clone);data=clone;fire();
    pend++;
    try{
      for(var t=0;t<4;t++){
        var cur=await srvRead();fn(cur.d);
        var w=await srvWrite(cur.d,cur.sha);
        if(!w.conflict){sha=w.sha;if(pend<=1){data=cur.d;fire()}return}
      }
      throw new Error('Soubor mezitím změnil někdo jiný, zkus to znovu.');
    }catch(e){
      try{var c=await srvRead();data=c.d;sha=c.sha}catch(e2){}
      fire();throw e;
    }finally{pend--}
  }
  async function poll(){
    if(!PROXY_URL||document.hidden||pend>0)return;
    try{var c=await srvRead(sha);if(c&&pend===0){data=c.d;sha=c.sha;fire()}}catch(e){}
  }
  setInterval(poll,20000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)poll()});

  /* ---------- fotky ---------- */
  function compress(file,max,q){
    return new Promise(function(res,rej){
      var img=new Image();
      img.onload=function(){
        var k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',q));
      };
      img.onerror=function(){rej(new Error('Obrázek nejde načíst'))};
      img.src=URL.createObjectURL(file);
    });
  }
  async function uploadPhoto(file){
    var du=await compress(file,PROXY_URL?1280:700,PROXY_URL?0.8:0.65),id=newId('p');
    if(!PROXY_URL)return {url:du,id:id};
    var r=await pxCall('POST',{id:id,content:du.split(',')[1]},'photo');
    var j={};try{j=await r.json()}catch(e){}
    if(!r.ok)throw new Error(j.error||('chyba '+r.status));
    photoCache[j.url]=du;
    return {url:j.url,id:id};
  }
  async function setPhoto(lid,f){
    var up=await uploadPhoto(f);
    var old=photos.filter(function(x){return x.lunchId===lid}).map(function(x){return x.id});
    await mutate(function(d){
      old.forEach(function(i){delete d.photos[i]});
      d.photos[up.id]={lunchId:lid,url:up.url,created:Date.now()};
    });
  }

  /* ---------- vrácení smazání ---------- */
  var undoT=null,undoFn=null;
  function showUndo(text,fn){
    undoFn=fn;$('undotx').textContent=text;$('undo').hidden=false;
    clearTimeout(undoT);undoT=setTimeout(function(){$('undo').hidden=true;undoFn=null},10000);
  }
  $('undobtn').onclick=async function(){
    var f=undoFn;$('undo').hidden=true;undoFn=null;
    if(f)try{await f();msg('Vráceno ✔')}catch(e){msg('Vrácení se nepovedlo: '+er(e))}
  };

  /* ---------- seznam, filtry, přehled ---------- */
  function priceNum(l){var m=String(l.price||'').replace(/\s/g,'').match(/\d+/);return m?+m[0]:null}
  function render(){
    var act=document.activeElement;
    if(act&&$('list').contains(act)&&/INPUT|TEXTAREA/.test(act.tagName)){pending=true;return}
    pending=false;
    if(!loaded){$('list').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';$('empty').hidden=true;return}
    var R={},P={};
    ratings.forEach(function(r){(R[r.lunchId]=R[r.lunchId]||[]).push(r)});
    photos.forEach(function(p){(P[p.lunchId]=P[p.lunchId]||[]).push(p)});
    var avg=function(l){var rs=R[l.id]||[];return rs.length?rs.reduce(function(a,r){return a+r.stars},0)/rs.length:-1};
    var hasPh=function(l){return !!((P[l.id]||[]).length||l.photo)};
    var q=norm($('q').value),ff=$('ff').value,pmin=parseFloat($('pmin').value),pmax=parseFloat($('pmax').value);
    var base=lunches.filter(function(l){
      if(q&&norm(l.name+' '+(l.code||'')+' '+(l.supplier||'')).indexOf(q)<0)return false;
      var n=(R[l.id]||[]).length;
      if(ff==='unrated'&&n)return false;
      if(ff==='rated'&&!n)return false;
      if(ff==='photo'&&!hasPh(l))return false;
      if(ff==='nophoto'&&hasPh(l))return false;
      if(!isNaN(pmin)||!isNaN(pmax)){var pn=priceNum(l);if(pn==null)return false;if(!isNaN(pmin)&&pn<pmin)return false;if(!isNaN(pmax)&&pn>pmax)return false}
      return true;
    });
    var cnt={'':base.length};
    base.forEach(function(l){var k=l.supplier||'-';cnt[k]=(cnt[k]||0)+1});
    var ch=$('chips');ch.innerHTML='';
    [['','Všichni'],['Soused','Soused'],['Hlaváček','Hlaváček'],['Karl','Karl'],['Zelená','Zelená'],['-','Bez dodavatele']].forEach(function(c){
      if(c[0]==='-'&&!cnt['-'])return;
      var b=document.createElement('button');b.type='button';b.className=supF===c[0]?'on':'';
      b.innerHTML=(SK[c[0]]?'<span class="dot s-'+SK[c[0]]+'"></span>':'')+esc(c[1])+' <span class="cn">'+(cnt[c[0]]||0)+'</span>';
      b.onclick=function(){supF=c[0];render()};
      ch.appendChild(b);
    });
    var arr2=base.filter(function(l){return !supF||(supF==='-'?!l.supplier:l.supplier===supF)});
    var s=$('sort').value;
    arr2.sort(function(a,b){
      if(s==='best')return avg(b)-avg(a)||(b.date||'').localeCompare(a.date||'');
      if(s==='az')return norm(a.name).localeCompare(norm(b.name));
      return (b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0);
    });
    var el=$('list');el.innerHTML='';
    $('empty').hidden=arr2.length>0;
    $('emptytx').textContent=lunches.length?'Nic nenalezeno.':'Zatím tu nejsou žádné obědy.';
    $('emptyadd').hidden=!!lunches.length;
    $('ftog').classList.toggle('act',!!(ff||!isNaN(pmin)||!isNaN(pmax)));
    arr2.forEach(function(l){el.appendChild(card(l,R[l.id]||[],P[l.id]||[],avg(l)))});
    renderStats(R,hasPh,avg);
  }
  document.addEventListener('focusout',function(){setTimeout(function(){if(pending)render()},150)});
  ['q','pmin','pmax'].forEach(function(i){$(i).oninput=render});
  $('sort').onchange=render;$('ff').onchange=render;

  function renderStats(R,hasPh,avg){
    var rank=lunches.filter(function(l){return (R[l.id]||[]).length}).map(function(l){return {l:l,a:avg(l),n:R[l.id].length}})
      .sort(function(x,y){return y.a-x.a||y.n-x.n}).slice(0,10);
    var h='<div class="stats-grid"><div class="stat"><b>'+lunches.length+'</b>jídel</div><div class="stat"><b>'+ratings.length+'</b>hodnocení</div><div class="stat"><b>'+lunches.filter(hasPh).length+'</b>s fotkou</div></div>';
    h+='<div class="h2">Nejlépe hodnocená jídla</div>';
    h+=rank.length?rank.map(function(x,i){
      return '<div class="rank"><span class="n">'+(['🥇','🥈','🥉'][i]||(i+1)+'.')+'</span><span class="t">'+esc(x.l.name)+(x.l.supplier?' <span class="meta">· '+esc(x.l.supplier)+'</span>':'')+'</span><span>'+stars(x.a)+' <b>'+x.a.toFixed(1)+'</b> <span class="meta">('+x.n+')</span></span></div>'}).join(''):'<div class="meta">Zatím nic nebylo hodnoceno.</div>';
    h+='<div class="h2">Dodavatelé podle hodnocení</div>';
    var rows=SUPN.map(function(sn){
      var sum=0,n=0;lunches.forEach(function(l){if(l.supplier===sn)(R[l.id]||[]).forEach(function(r){sum+=r.stars;n++})});
      return {sn:sn,a:n?sum/n:0,n:n};
    });
    h+=rows.map(function(r){
      return '<div class="bar-s s-'+SK[r.sn]+'"><span class="nm">'+esc(r.sn)+'</span><span class="tr"><span class="fl" style="display:block;width:'+Math.round(r.a/5*100)+'%"></span></span><span>'+(r.n?'<b>'+r.a.toFixed(1)+'</b> <span class="meta">('+r.n+')</span>':'<span class="meta">—</span>')+'</span></div>'}).join('');
    $('statsbody').innerHTML=h;
  }

  function card(l,rs,ph,av){
    var d=drafts[l.id]||(drafts[l.id]={name:store('name')||'',stars:0,text:''});
    ph=ph.slice().sort(function(x,y){return (y.created||0)-(x.created||0)});
    ph=ph.length?[ph[0]]:(l.photo?[{url:l.photo}]:[]);
    var key=SK[l.supplier]||'';
    var a=document.createElement('article');a.className='item'+(key?' s-'+key:'');
    var meta=[l.date,l.supplier?l.code:(l.code||l.place)].filter(Boolean).map(esc).join(' · ');
    rs.sort(function(x,y){return (y.created||0)-(x.created||0)});
    var soup=/^Pol[eé]v/i.test(l.code||'')||/pol[eé]vk|vývar|kaldoun/i.test(l.name);
    a.innerHTML='<div class="cph'+(ph.length?' has':'')+'">'+(ph.length?'<img loading="lazy" src="'+esc(photoCache[ph[0].url]||ph[0].url)+'" alt="">':'<span class="emo">'+(soup?'🍲':'🍽️')+'</span>')+
      (l.supplier?'<span class="pill tl"><i class="dot s-'+key+'"></i>'+esc(l.supplier)+'</span>':'')+
      (rs.length?'<span class="pill tr"><span class="star">★</span>'+av.toFixed(1)+'</span>':'')+
      (l.price?'<span class="pill br">'+esc(l.price)+'</span>':'')+'</div>'+
      '<div class="cb"><h3>'+esc(l.name)+'</h3><div class="meta">'+meta+'</div>'+
      (rs.length?'<div class="avg">'+stars(av)+' <span class="meta">'+rs.length+'×</span></div>':'')+
      '<details><summary><span>⭐ Hodnotit · 📷 '+(ph.length?'změnit fotku':'přidat fotku')+'</span></summary>'+
      rs.map(function(r,i){
        return '<div class="rt" data-i="'+i+'"><b>'+esc(r.name)+'</b> '+stars(r.stars)+(r.text?' <span>'+esc(r.text)+'</span>':'')+'<button class="x" title="Smazat hodnocení">✕</button></div>'}).join('')+
      '<div class="fm"><input type="text" class="nm" placeholder="Tvoje jméno"><div class="pick">'+
      [1,2,3,4,5].map(function(n){return '<button type="button" data-n="'+n+'" aria-label="'+n+' z 5">★</button>'}).join('')+
      '</div><input type="text" class="tx" placeholder="Komentář (nepovinné)"><button class="rate">Uložit hodnocení</button></div>'+
      '<label class="addph">📷 '+(ph.length?'Změnit fotku':'Přidat fotku jídla')+'<input type="file" accept="image/*"></label></details>'+
      '<button class="del">Smazat jídlo</button></div>';
    var det=a.querySelector('details');
    if(openIds[l.id])det.open=true;
    det.addEventListener('toggle',function(){openIds[l.id]=det.open});
    var pim=a.querySelector('.cph img');
    if(pim)pim.onclick=function(){$('lb').firstElementChild.src=pim.src;$('lb').hidden=false};
    var nm=a.querySelector('.nm'),tx=a.querySelector('.tx'),pick=a.querySelectorAll('.pick button');
    nm.value=d.name;tx.value=d.text;
    function paint(){[].forEach.call(pick,function(b){b.className=(+b.dataset.n<=d.stars)?'on':''})}
    paint();
    [].forEach.call(pick,function(b){b.onclick=function(){d.stars=+b.dataset.n;paint()}});
    nm.oninput=function(){d.name=nm.value;store('name',nm.value)};
    tx.oninput=function(){d.text=tx.value};
    a.querySelector('.rate').onclick=async function(){
      var n=d.name.trim();
      if(!n)return msg('Napiš své jméno.');
      if(!d.stars)return msg('Vyber počet hvězdiček.');
      var rec={lunchId:l.id,name:n,stars:d.stars,text:d.text.trim(),created:Date.now()};
      d.stars=0;d.text='';
      try{await mutate(function(x){x.ratings[l.id+'_'+slug(n)]=rec});msg('Hodnocení uloženo ✔')}
      catch(e){msg('Hodnocení se nepodařilo uložit: '+er(e))}
    };
    [].forEach.call(a.querySelectorAll('.rt .x'),function(b){
      b.onclick=async function(){
        var r=rs[+b.parentNode.dataset.i];if(!r)return;
        var snap=strip(r);
        try{
          await mutate(function(x){delete x.ratings[r.id]});
          showUndo('Hodnocení od '+r.name+' smazáno.',function(){return mutate(function(x){x.ratings[r.id]=snap})});
        }catch(e){msg('Smazání se nepovedlo: '+er(e))}
      };
    });
    a.querySelector('.addph input').onchange=async function(e){
      var f=e.target.files[0];
      if(!f)return;
      msg('Nahrávám fotku…',true);
      try{await setPhoto(l.id,f);msg('Fotka uložena ✔')}catch(err){msg('Fotku se nepodařilo nahrát: '+er(err))}
    };
    a.querySelector('.del').onclick=async function(){
      var rr=ratings.filter(function(r){return r.lunchId===l.id}),pp=photos.filter(function(p){return p.lunchId===l.id});
      var snap={l:strip(l),rs:rr.map(function(r){return [r.id,strip(r)]}),ps:pp.map(function(p){return [p.id,strip(p)]})};
      try{
        await mutate(function(x){delete x.lunches[l.id];rr.forEach(function(r){delete x.ratings[r.id]});pp.forEach(function(p){delete x.photos[p.id]})});
        showUndo('Jídlo „'+l.name+'“ smazáno.',function(){return mutate(function(x){
          x.lunches[l.id]=snap.l;snap.rs.forEach(function(p){x.ratings[p[0]]=p[1]});snap.ps.forEach(function(p){x.photos[p[0]]=p[1]});
        })});
      }catch(e){msg('Smazání se nepovedlo: '+er(e))}
    };
    return a;
  }

  /* ---------- přidávání jídel ---------- */
  async function addLunches(items,date){
    var have={};lunches.forEach(function(l){var k=norm(l.name);(have[k]=have[k]||[]).push(l)});
    var added=0,seen=0,plan=[],ids=[];
    items.forEach(function(x){
      var k=norm(x.name),list=have[k]||[];
      var old=list.filter(function(o){return !o.supplier||!x.supplier||o.supplier===x.supplier})[0];
      if(old&&old.id){
        seen++;ids.push(old.id);var up={};
        if(date&&(old.date||'')<date)up.date=date;
        if(!old.supplier&&x.supplier)up.supplier=x.supplier;
        if(Object.keys(up).length)plan.push(['u',old.id,up]);
      }else if(old){ids.push(null)}
      else{
        added++;var id=newId();ids.push(id);
        var rec={name:x.name,price:x.price||'',code:x.code||'',supplier:x.supplier||'',date:date,created:Date.now()};
        plan.push(['a',id,rec]);(have[k]=have[k]||[]).push(Object.assign({},rec));
      }
    });
    var done=plan.length?mutate(function(d){plan.forEach(function(p){d.lunches[p[1]]=p[0]==='a'?p[2]:Object.assign({},d.lunches[p[1]],p[2])})}):Promise.resolve();
    return {added:added,seen:seen,ids:ids,done:done};
  }

  $('save').onclick=async function(){
    var n=$('name').value.trim();
    if(!n)return msg('Vyplň název jídla.');
    var f=$('mphoto').files[0];
    $('save').disabled=true;
    try{
      var r=await addLunches([{name:n,price:$('price').value.trim(),code:'',supplier:$('sup').value}],$('date').value);
      closeAdd();msg('Ukládám…',true);   // jídlo je na obrazovce hned, na pozadí se ukládá
      await r.done;
      var lid=r.ids[0];
      if(f&&lid){msg('Nahrávám fotku…',true);await setPhoto(lid,f)}
      ['name','price'].forEach(function(i){$(i).value=''});$('sup').value='';$('mphoto').value='';$('mphname').textContent='';
      msg((r.added?'Jídlo přidáno ✔':'Takové jídlo už v seznamu je, posunul jsem mu datum.')+(f?' Fotka uložena.':''));
    }catch(e){openAdd('man');msg('Uložení se nepovedlo: '+er(e))}
    $('save').disabled=false;
  };

  /* ---------- načtení jídelníčku z obrázku (rozpoznávání se stahuje až teď) ---------- */
  var blob=null,worker=null;
  $('file').onchange=function(e){
    blob=e.target.files[0]||null;
    if(!blob)return;
    var p=$('preview');p.src=URL.createObjectURL(blob);p.hidden=false;
    $('ocr').disabled=false;$('menu').hidden=true;
    msg('Klepni na „Přečíst text z obrázku“.');
  };
  function loadScript(src){
    return new Promise(function(res,rej){
      var s=document.createElement('script');s.src=src;s.onload=res;
      s.onerror=function(){rej(new Error('Nepodařilo se načíst '+src+' – je v repozitáři složka „'+OCR_DIR+'“?'))};
      document.head.appendChild(s);
    });
  }
  async function getWorker(){
    if(worker)return worker;
    if(!window.Tesseract)await loadScript(OCR_DIR+'/tesseract.min.js');
    var base=new URL(OCR_DIR,location.href).href.replace(/\/$/,'');
    worker=await Tesseract.createWorker('ces',1,{
      workerPath:base+'/worker.min.js',corePath:base+'/tesseract-core-simd-lstm.wasm.js',langPath:base,gzip:true,
      logger:function(m){if(m.status==='recognizing text')msg('Čtu text… '+Math.round(m.progress*100)+' %',true)}
    });
    return worker;
  }
  function shrink(file){
    return new Promise(function(res,rej){
      var img=new Image();
      img.onload=function(){
        var k=Math.min(2.5,2000/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
        var x=c.getContext('2d');x.filter='grayscale(1) contrast(1.2)';x.drawImage(img,0,0,c.width,c.height);
        c.toBlob(function(b){b?res({blob:b,w:c.width}):rej(new Error('canvas'))},'image/png');
      };
      img.onerror=rej;img.src=URL.createObjectURL(file);
    });
  }
  function parse(text){
    var lines=text.split(/\n/).map(function(l){return l.trim()}).filter(function(l){return l.length>2});
    var out={};
    var d=text.match(/(\d{1,2})\s*\.\s*(\d{1,2})\s*\.\s*(20\d{2})/);
    if(d)out.date=d[3]+'-'+('0'+d[2]).slice(-2)+'-'+('0'+d[1]).slice(-2);
    var pr=/(\d{2,4}(?:[.,]\d{1,2})?)\s*(?:,-|Kč|KČ|CZK)/i,pm=text.match(pr);
    if(pm)out.price=pm[1].replace('.',',')+' Kč';
    var good=function(l){var a=(l.match(/[A-Za-zÀ-žÁ-ž]/g)||[]).length;return a/l.length>0.6&&l.length>=5&&l.length<=70};
    var withPrice=lines.filter(function(l){return pr.test(l)&&good(l.replace(pr,''))})[0];
    var name=withPrice?withPrice.replace(pr,'').replace(/^[\d\s.,)\-–]+/,'').replace(/[\s.,\-–]+$/,''):(lines.filter(good)[0]||'');
    if(name)out.name=name;
    return out;
  }
  function top(o){var b='',n=0;Object.keys(o).forEach(function(k){if(o[k]>n){n=o[k];b=k}});return b}
  function parseMenu(words,W){
    var ws=(words||[]).filter(function(w){return w.text&&w.text.trim()}).map(function(w){
      return {t:w.text.trim(),c:w.confidence,x0:w.bbox.x0,x1:w.bbox.x1,cy:(w.bbox.y0+w.bbox.y1)/2,h:w.bbox.y1-w.bbox.y0}});
    if(!ws.length)return [];
    var hs=ws.map(function(w){return w.h}).sort(function(a,b){return a-b}),mh=hs[hs.length>>1]||20;
    var priceRe=/^\d{1,3}[.,]\d{2}$/;
    var pr=ws.filter(function(w){return w.x0>W*0.6&&priceRe.test(w.t)}).sort(function(a,b){return a.cy-b.cy});
    var anchors=[];
    pr.forEach(function(p){
      var l=anchors[anchors.length-1];
      if(l&&Math.abs(l.cy-p.cy)<mh*0.8){if(p.x0<l.x0)anchors[anchors.length-1]=p}else anchors.push(p);
    });
    // oddělovače skupin: řádky „Termín pro objednání vypršel…“ nad každou skupinou
    var sp=[];
    ws.filter(function(w){return /^(term[ií]n|objedn[aá]n[ií]|vypr[sš]el|objedn[aá]v[aá]te|burzy|j[ií]del)/i.test(w.t)&&w.x0>W*0.4}).map(function(w){return w.cy}).sort(function(a,b){return a-b})
      .forEach(function(y){if(!sp.length||y-sp[sp.length-1]>mh*3)sp.push(y)});
    var useG=sp.length>=2;
    var ok=' a s v z k o u i do na po ve se ze od ke ku ';
    var rows=[];
    anchors.forEach(function(a){
      var byX=function(p,q){return p.x0-q.x0};
      var tk=ws.filter(function(w){return Math.abs(w.cy-a.cy)<mh*0.9&&w.x0>=W*0.125&&w.x1<=a.x0-2&&/[A-Za-zÀ-ž0-9]/.test(w.t)&&(w.c==null||w.c>=25||/^\d/.test(w.t))&&(w.t.length>3||/\d/.test(w.t)||w.c==null||w.c>=80)&&!/[:|©®@]/.test(w.t)}).sort(byX).map(function(w){return w.t});
      tk=tk.filter(function(t){return t.length>2||/\d/.test(t)||ok.indexOf(' '+t.toLowerCase()+' ')>-1});
      while(tk.length>1&&tk[tk.length-1].length<=1&&!/\d/.test(tk[tk.length-1]))tk.pop();
      var name=tk.join(' ').trim();
      if(name.length<3)return;
      name=name.charAt(0).toUpperCase()+name.slice(1);
      var code=ws.filter(function(w){return w.x0<W*0.12&&Math.abs(w.cy-a.cy)<mh*2.2}).sort(function(p,q){return Math.abs(p.cy-q.cy)<mh*0.5?p.x0-q.x0:p.cy-q.cy}).map(function(w){return w.t}).join(' ');
      var nm=code.match(/\b([OPDS0]\d{1,2})\b/i);
      var num=nm?nm[1].toUpperCase().replace(/^0(?=\d)/,'O'):'';
      var kind=/Pol[eé]v/i.test(code)?'Polévka':(/Ob[eě]d/i.test(code)?'Oběd':'');
      rows.push({name:name,price:a.t.replace('.',',').replace(/,00$/,'')+' Kč',cy:a.cy,sup:supOf(code),kind:kind,num:num,g:useG?sp.filter(function(y){return y<a.cy}).length:-1});
    });
    if(useG){
      var gs={};
      rows.forEach(function(r){var g=gs[r.g]=gs[r.g]||{s:{},k:{},n:0};g.n++;if(r.sup)g.s[r.sup]=(g.s[r.sup]||0)+1;if(r.kind)g.k[r.kind]=(g.k[r.kind]||0)+1});
      var gl=Object.keys(gs).map(Number).sort(function(a,b){return a-b});
      gl.forEach(function(k){gs[k].sup=top(gs[k].s);gs[k].kind=top(gs[k].k)});
      var G=gl.map(function(k){return gs[k]});
      var isSoup=function(g){return g.kind==='Polévka'||g.n===1};
      // polévka (nebo skupina o jednom jídle) patří stejnému dodavateli jako následující skupina jídel
      G.forEach(function(g,i){if(!g.sup&&isSoup(g)&&G[i+1]&&G[i+1].sup)g.sup=G[i+1].sup});
      // skupina jídel bez nálezu převezme dodavatele od polévky před ní
      G.forEach(function(g,i){if(!g.sup&&G[i-1]&&G[i-1].sup)g.sup=G[i-1].sup});
      for(var gi=G.length-2;gi>=0;gi--)if(!G[gi].sup&&G[gi+1].sup)G[gi].sup=G[gi+1].sup;
      rows.forEach(function(r){var g=gs[r.g];r.sup=g.sup||r.sup;r.kind=g.kind||r.kind});
    }
    // bez oddělovačů: chybějící dodavatel se převezme z nejbližšího dalšího řádku, jinak z předchozího
    for(var i=0;i<rows.length;i++){
      if(rows[i].sup)continue;
      var j=i+1;while(j<rows.length&&!rows[j].sup)j++;
      if(j<rows.length)rows[i].sup=rows[j].sup;else if(i>0)rows[i].sup=rows[i-1].sup;
    }
    return rows.map(function(r){return {name:r.name,price:r.price,supplier:r.sup,code:r.kind?r.kind+(r.num?' '+r.num:''):''}});
  }
  function showMenu(items){
    var m=$('menu');m.innerHTML='<div class="meta" style="margin-top:12px">Nalezeno '+items.length+' jídel. Odškrtni, co nechceš, a oprav chyby a dodavatele. Jídla, která už v seznamu jsou, se nezdvojí (jen se jim posune datum).</div>';
    items.forEach(function(it){
      var r=document.createElement('div');r.className='mrow';
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=true;
      var n=document.createElement('input');n.type='text';n.value=it.name;
      var pp=document.createElement('input');pp.type='text';pp.value=it.price;
      var sp=document.createElement('select');
      [''].concat(SUPN).forEach(function(o){var op=document.createElement('option');op.value=o;op.textContent=o||'— dodavatel —';sp.appendChild(op)});
      sp.value=it.supplier||'';
      var s=document.createElement('small');s.textContent=it.code||'';
      r.appendChild(cb);r.appendChild(n);r.appendChild(pp);r.appendChild(sp);if(it.code)r.appendChild(s);
      r._get=function(){return cb.checked&&n.value.trim()?{name:n.value.trim(),price:pp.value.trim(),code:it.code||'',supplier:sp.value}:null};
      m.appendChild(r);
    });
    var b=document.createElement('button');b.textContent='Uložit vybrané obědy';
    b.onclick=async function(){
      var sel=[].map.call(m.querySelectorAll('.mrow'),function(r){return r._get()}).filter(Boolean);
      if(!sel.length)return msg('Nic není vybráno.');
      b.disabled=true;
      try{
        var r=await addLunches(sel,$('mdate').value);
        closeAdd();msg('Ukládám…',true);
        await r.done;
        m.hidden=true;m.innerHTML='';
        msg('Přidáno '+r.added+' nových jídel'+(r.seen?', '+r.seen+' už v seznamu bylo.':'.')+' ✔');
      }catch(e){openAdd('menu');b.disabled=false;msg('Uložení se nepovedlo: '+er(e))}
    };
    var w=document.createElement('div');w.className='btns';w.appendChild(b);m.appendChild(w);
    m.hidden=false;
  }
  $('ocr').onclick=async function(){
    if(!blob)return msg('Nejdřív vyber obrázek.');
    $('ocr').disabled=true;$('menu').hidden=true;msg('Připravuji čtení (poprvé se stahuje rozpoznávání textu, pár MB)…',true);
    try{
      var w=await getWorker();
      var sh=await shrink(blob);
      var r=await w.recognize(sh.blob);
      var text=r.data.text||'';
      if(!text.trim()){msg('V obrázku se nepodařilo najít žádný text – přidej jídlo ručně.')}
      else{
        var items=parseMenu(r.data.words,sh.w);
        if(items.length>=2){showMenu(items);msg('Hotovo – zkontroluj seznam a ulož. Nastav správné datum jídelníčku.',true)}
        else{
          var o=parse(text);
          setTab('man');
          if(o.name)$('name').value=o.name;
          if(o.price)$('price').value=o.price;
          if(o.date)$('date').value=o.date;
          msg('Nenašel jsem tabulku jídel – údaje jsem předvyplnil v „Přidat ručně“, zkontroluj je a klepni na „Přidat jídlo“.');
        }
      }
    }catch(e){
      worker=null;
      msg('Čtení textu se nepodařilo: '+er(e)+' Přidej jídlo ručně.',true);
    }
    $('ocr').disabled=false;
  };

  /* ---------- záloha ---------- */
  $('fexp').onclick=function(){
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
    a.download='obedy-data.json';a.click();
  };
  $('fimp').onchange=async function(e){
    var f=e.target.files[0];if(!f)return;
    try{
      var d=norm3(JSON.parse(await f.text()));
      await mutate(function(x){['lunches','ratings','photos'].forEach(function(n){Object.assign(x[n],d[n])})});
      msg('Záloha načtena ✔');
    }catch(err){msg('Zálohu nejde načíst: '+er(err))}
    e.target.value='';
  };

  /* ---------- start ---------- */
  async function init(){
    if(!PROXY_URL){data=localLoad();loaded=true;fire();$('fstat').textContent='Lokální režim – data jsou jen v tomto prohlížeči.';return}
    try{
      var c=await srvRead();data=c.d;sha=c.sha;loaded=true;fire();
      $('fstat').textContent='☁ Sdílená data ✔ změny vidí všichni';
    }catch(e){loaded=true;fire();msg('Data se nepodařilo načíst: '+er(e),true);$('fstat').textContent='⚠ Data se nepodařilo načíst.'}
  }
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
  init();
})();

</script>
